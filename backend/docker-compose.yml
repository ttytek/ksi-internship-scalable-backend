services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ksi
      POSTGRES_PASSWORD: ksi
      POSTGRES_DB: ksi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ksi -d ksi"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "${APP_PORT}:${APP_PORT}"
    environment:
      APP_PORT: "${APP_PORT}"
      APP_NAME: ksi
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://ksi:ksi@db:5432/ksi
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
