[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ksi-checker"
version = "0.1.0"
description = "KSI judging worker"
requires-python = ">=3.12"
dependencies = [
    "ksi @ file:../backend",
    "redis>=5.0.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
ksi-checker = "ksi_checker.worker:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ksi_checker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../backend/src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
